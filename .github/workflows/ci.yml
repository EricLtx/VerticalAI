name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
      # Raw job logs need a GitHub login; annotations and the step summary
      # do not. On failure, surface every failing test by name so a public
      # reader (and the API) can see what broke without the log.
      - name: Name the failing tests
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$|^test .* \.\.\. FAILED|panicked at|^---- .* stdout ----|^error(\[E[0-9]+\])?:" test.log | head -60 | while IFS= read -r line; do
            printf '::error title=cargo test::%s\n' "$line"
            printf -- '- `%s`\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          grep -E "^test result:" test.log | grep -v " 0 failed" | while IFS= read -r line; do
            printf '::error title=suite::%s\n' "$line"
          done
      # The other half of the `bedrock` feature gate. The default build has no
      # AWS SDK in it (Ruling 30), so `cargo test --workspace` above exercises
      # the refusal; this one *runs* the tests the feature turns on — the EU
      # mount path included — rather than only compiling them, so neither half
      # of the gate can rot unnoticed.
      - name: The EU arch's transport builds and its mount path runs
        run: cargo test -p vk-ipc -p vk-arch-anthropic --features vk-ipc/bedrock
      - name: And the daemon with it
        run: cargo check -p vkd --features bedrock --all-targets
      # And that the crates stay buildable with every optional feature off,
      # which is what a node that wants none of the AWS supply chain builds.
      - name: The build without any optional feature
        run: cargo check --no-default-features -p vkd -p vk-arch-anthropic
  arch-ollama:
    # The Ollama adapter against a real container and a real model. Not on
    # every branch push: it starts a container, pulls the 1B model and spends
    # minutes of CPU, which is a cost worth paying on master and on request,
    # not on every commit. The rest of the adapter's tests — the stand-in
    # server, the refusals, the manifest — run in `test` above on all three
    # operating systems, so a branch is still covered.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start Ollama under the caps the kernel imposes
        run: docker run -d --name vk-ollama -p 127.0.0.1:11434:11434 -v vk-ollama:/root/.ollama --memory 12g --cpus 6 ollama/ollama:0.33.3
      - name: Drive the real container
        env:
          VK_OLLAMA: '1'
          # Never the demo model here: 9.6 GB a run.
          VK_TEST_MODEL: gemma3:1b
        run: cargo test -p vk-arch-ollama -- --ignored
      - name: Stop the container
        if: always()
        run: docker rm -f vk-ollama
  sign:
    # Signs the four release binaries for the SP1 gate (item 1: signed
    # binaries install without SmartScreen/Smart App Control prompts). Tries,
    # in order, and never fails the workflow over a secret that is not there
    # yet:
    #   1. Azure Trusted Signing, when all six AZURE_* secrets are set.
    #   2. An OV certificate through signtool, when SIGNING_CERT_B64 is set.
    #   3. Neither: prints "unsigned: no signing secrets configured" and
    #      uploads the same binaries under an `unsigned-` prefix, so a run
    #      before either secret exists still succeeds and still leaves
    #      something installable behind.
    # The founder has not chosen between the two paths (README.md, "Signing
    # release binaries"); both are wired up so whichever secret set is added
    # first is the one that runs.
    if: ${{ github.event_name == 'push' }}
    needs: test
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
      SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the four binaries release-mode
        run: cargo build --release -p vk-cli -p vkd -p vk-mcp -p vk-service
      - name: Stage them under one directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/vk.exe target/release/vkd.exe target/release/vk-mcp.exe target/release/vkd-service.exe dist/
      - name: Decide which signing path applies
        id: decide
        shell: bash
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_ENDPOINT" ] && [ -n "$AZURE_CODE_SIGNING_NAME" ] && [ -n "$AZURE_CERT_PROFILE_NAME" ]; then
            echo "path=azure" >> "$GITHUB_OUTPUT"
          elif [ -n "$SIGNING_CERT_B64" ]; then
            echo "path=ov-cert" >> "$GITHUB_OUTPUT"
          else
            echo "path=unsigned" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign with Azure Trusted Signing
        if: steps.decide.outputs.path == 'azure'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
      - name: Sign with an OV certificate
        if: steps.decide.outputs.path == 'ov-cert'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$pwd\cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT_B64))
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { $signtool = 'signtool.exe' }
          $exes = Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName }
          $signArgs = @('sign', '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256', '/f', "$pwd\cert.pfx")
          if ($env:SIGNING_CERT_PASSWORD) { $signArgs += @('/p', $env:SIGNING_CERT_PASSWORD) }
          $signArgs += $exes
          & $signtool @signArgs
          if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
          Remove-Item "$pwd\cert.pfx" -Force
      - name: No signing secrets configured
        if: steps.decide.outputs.path == 'unsigned'
        shell: bash
        run: |
          echo "unsigned: no signing secrets configured"
      - name: Upload signed artifacts
        if: steps.decide.outputs.path != 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: vk-windows-signed
          path: |
            dist/vk.exe
            dist/vkd.exe
            dist/vk-mcp.exe
            dist/vkd-service.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned artifacts
        if: steps.decide.outputs.path == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-vk-windows
          path: |
            dist/vk.exe
            dist/vkd.exe
            dist/vk-mcp.exe
            dist/vkd-service.exe
          if-no-files-found: error
          retention-days: 30
