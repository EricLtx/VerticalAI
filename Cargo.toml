[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/EricLtx/VerticalAI"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "vendored"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
