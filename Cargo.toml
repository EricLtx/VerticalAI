[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/EricLtx/VerticalAI"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
