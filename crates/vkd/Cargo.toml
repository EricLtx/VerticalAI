[package]
name = "vkd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI kernel daemon: the vkd binary"

[lib]
name = "vkd"
path = "src/lib.rs"

[[bin]]
name = "vkd"
path = "src/main.rs"

[features]
# Build the EU (Bedrock) arch into this daemon. See `vk-arch-anthropic`'s own
# feature for the build-cost measurement behind the default.
default = ["bedrock"]
bedrock = ["vk-ipc/bedrock"]

[dependencies]
vk-kernel = { path = "../vk-kernel" }
vk-store = { path = "../vk-store" }
vk-ipc = { path = "../vk-ipc", default-features = false }
# The API arches key source (`--anthropic-key-file`), nothing more.
vk-arch-anthropic = { path = "../vk-arch-anthropic", default-features = false }
# The passkey pages (SP1b Task 5), served on loopback beside the endpoint.
vk-web = { path = "../vk-web" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
