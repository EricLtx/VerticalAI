[package]
name = "vk-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI harness: confined launch of the agents the kernel runs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# Contract types only (Ctx, Register, Label, Clearance, KernelError). Never
# vk-kernel: the kernel depends on this crate, so the dependency may not run the
# other way. The kernel reaches the workspace projection through the `Host`
# trait, whose every type is a contract.
vk-contracts = { path = "../vk-contracts" }

[target.'cfg(unix)'.dependencies]
# Signalling the launched child's whole process group at a kill; `Child::kill`
# reaches only the process itself.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Object containment (`confine::JobGovernor`) and, for `netwatch`, the TCP
# connection table of a launched process (`GetExtendedTcpTable`). 0.62 was the
# newest line when spike 3a (2026-09-24) compiled every name the governor uses
# against 0.62.2; spike 4a (2026-09-24) added the IpHelper and WinSock features
# and compiled `netwatch` against the same version.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"
