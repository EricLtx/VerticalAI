[package]
name = "vk-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI harness: confined launch of the agents the kernel runs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Job Object containment (`confine::JobGovernor`): a kernel-launched process
# tree dies when the kernel's handle closes and stays under its memory and CPU
# caps. 0.62 was the newest line when spike 3a (2026-09-24) compiled every
# name the governor uses against 0.62.2, unchanged from the plan.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
