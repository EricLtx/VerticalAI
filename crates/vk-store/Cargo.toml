[package]
name = "vk-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI storage tiering: SQLite metadata, encrypted blobs, ledger segments"

[dependencies]
vk-contracts = { path = "../vk-contracts" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
chacha20poly1305.workspace = true
keyring.workspace = true
anyhow.workspace = true
directories.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

# `flock` for the single-writer lock on the state directory; Windows uses the
# file share mode the standard library already exposes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The state directory's DACL under a service account (SP1b Task 6 fix round 1):
# creating it with a protected descriptor and auditing one that is already
# there. Same 0.62 line as `vk-harness` and `vk-ipc`, so the workspace builds
# one version of the Win32 bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
