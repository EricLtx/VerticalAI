[package]
name = "vk-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI CLI: the vk binary"

[[bin]]
name = "vk"
path = "src/main.rs"

[dependencies]
vk-contracts = { path = "../vk-contracts" }
# The shell speaks to the daemon; it mounts no arch itself, so it has
# no use for the AWS SDK behind `vk-ipc`'s default feature.
vk-ipc = { path = "../vk-ipc", default-features = false }
vk-kernel = { path = "../vk-kernel" }
vk-store = { path = "../vk-store" }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
hex.workspace = true
# `vk secret set` writes to this account's keyring, directly: no daemon is
# involved, so the shell needs the same keyring this node's store uses.
keyring.workspace = true
# Reading a secret from the terminal with the echo off. Doing it by hand means
# `SetConsoleMode` on Windows and termios on Unix, in this crate, for one
# prompt; this is the crate everything else uses for it.
rpassword = "7"
# The typed secret never sits in a plain `String`: this is the one process
# that sees the key as a human typed it.
zeroize = "1"

[dev-dependencies]
tempfile = "3"
