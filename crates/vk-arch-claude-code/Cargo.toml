[package]
name = "vk-arch-claude-code"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI arch adapter: Claude Code as a pure-completion arch"

[dependencies]
vk-contracts = { path = "../vk-contracts" }
vk-kernel = { path = "../vk-kernel" }
serde_json.workspace = true
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
# Signalling the child's whole process group at a timeout; `Child::kill` reaches
# only the process itself.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
