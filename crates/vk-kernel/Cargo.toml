[package]
name = "vk-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI kernel: syscalls, locks, labels, ledger over vk-store"

[dependencies]
vk-contracts = { path = "../vk-contracts" }
vk-store = { path = "../vk-store" }
# The confined harness: the governor, the workspace projection, the launch and
# the egress telemetry the `StepKind::Harness` scheduler drives. The dependency
# runs this way only — `vk-harness` depends on `vk-contracts`, never back on the
# kernel — so the kernel can call it while `vk-harness` stays a leaf.
vk-harness = { path = "../vk-harness" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
rand.workspace = true
hex.workspace = true
keyring.workspace = true
base64.workspace = true
ed25519-dalek = "2"
# Key material is wiped when it is dropped (SP1a review M4): the master key,
# every DEK and the node seed, and the base64 strings they pass through.
zeroize = "1"

[dev-dependencies]
tempfile = "3"
